<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Meu Mundo da Imaginação · Grupo V</title>
<meta property="og:title" content="Meu Mundo da Imaginação · Formatura do Grupo V">
<meta property="og:description" content="O caderno da professora, o vídeo para as crianças, o caderno da criança e o diário da formatura.">
<meta property="og:image" content="https://www.escolaamadeus.com/amigomagico/img/capa.jpg">
<meta name="theme-color" content="#1E2C78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* O menu da atividade "Meu amigo mágico" numa tela só, sem rolar: a capa azul do caderno vira uma faixa curta no topo
   e, embaixo, a folha pautada com quatro quadros grandes (2x2), um por função. Mesmo papel, letras e cores do caderno. */
:root {
  --papel: #FFFDF7; --pauta: #DCE6F1; --margem: #F2B2AC; --mesa: #ECE4D6;
  --tinta: #22338A; --tinta-2: #4A5A9E; --tinta-3: #8E98C6;
  --laranja: #E9832A; --rosa: #E5747D;
  --capa: #1E2C78; --capa-escura: #16205A;
  --titulo: Caveat, "Segoe Print", cursive; --mao: "Patrick Hand", "Segoe Print", cursive;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--mesa); }
body { margin: 0; color: var(--tinta); font-family: var(--mao); font-size: 17px; line-height: 1.3; -webkit-tap-highlight-color: transparent; overflow: hidden; }
.livro { height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--papel); box-shadow: 0 0 40px rgba(80, 60, 20, .16); }

/* a faixa da capa */
.capa { position: relative; flex: none; overflow: hidden; color: #fff; display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 46px 14px 30px;
  background:
    radial-gradient(120% 120% at 20% 0%, rgba(255, 255, 255, .08), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px),
    linear-gradient(160deg, var(--capa) 0%, var(--capa-escura) 100%); }
.capa::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 70%, rgba(255,255,255,.06)); }
.capa .elastico { position: absolute; top: 0; bottom: 0; right: 20px; width: 11px; background: linear-gradient(90deg, #C9661A, var(--laranja) 40%, #F5A35A 60%, #C9661A); box-shadow: 0 0 10px rgba(0,0,0,.35); }
.capa .logo { width: 132px; height: auto; flex: none; }
.capa h1 { margin: 0 0 0 auto; text-align: right; font: 700 25px/24px var(--titulo); }
.capa h1 span { display: block; font-size: 21px; color: #F7B7BC; }
.sair { position: absolute; z-index: 1; left: 30px; bottom: 3px; font: 400 13px/1 var(--mao); color: #AEB6E0; text-decoration: none; }

/* a folha pautada com os quatro quadros */
.folha { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px;
  padding: 14px 14px calc(14px + env(safe-area-inset-bottom)) 50px;
  background-image: linear-gradient(90deg, transparent 36px, var(--margem) 36px, var(--margem) 37.5px, transparent 37.5px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--pauta) 31px 32px); }
.intro { margin: 0; font: 700 22px/26px var(--titulo); color: var(--tinta-2); }
.grade { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
.quadro { position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px;
  padding: 10px 8px; background: #fff; border: 0; border-radius: 6px; box-shadow: 0 6px 14px rgba(34, 51, 138, .12);
  color: inherit; font: inherit; text-decoration: none; cursor: pointer; }
.quadro:active { transform: scale(.98); }
.quadro:focus-visible { outline: 3px solid var(--laranja); outline-offset: 3px; }
.quadro .n { position: absolute; top: 4px; left: 9px; font: 700 26px/1 var(--titulo); color: var(--laranja); }
.quadro .des { position: relative; flex: 1 1 0; min-height: 0; width: 100%; margin-top: 8px; }
.quadro .des img, .quadro .des svg { position: absolute; inset: 0; margin: auto; max-width: 84%; max-height: 100%; width: auto; height: auto; display: block; }
.quadro .des svg { width: 84%; height: 100%; }
.quadro .des img.foto { border-radius: 8px; box-shadow: 0 3px 8px rgba(20, 25, 40, .25); }
.quadro b { flex: none; font: 700 25px/24px var(--titulo); }
.quadro small { flex: none; font-size: 14px; line-height: 17px; color: var(--tinta-2); }
.quadro .ir { flex: none; font: 700 19px/1 var(--titulo); color: var(--laranja); }
@media (max-height: 700px) {
  .quadro b { font-size: 22px; line-height: 21px; }
  .quadro small { font-size: 13px; line-height: 15px; }
  .intro { font-size: 20px; line-height: 22px; }
  .capa { padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px; }
}
@media (max-width: 360px) { .quadro small { display: none; } }

/* o vídeo em tela cheia */
.cinema { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0b0f1d; color: #fff;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.cinema.on { display: flex; }
.cinema .barra { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
.cinema button, .cinema a { font: 700 23px/1 var(--titulo); color: #fff; background: none; border: 0; text-decoration: none; cursor: pointer; padding: 8px 4px; }
.cinema a { color: #F5A35A; border-bottom: 2px solid #F5A35A; padding-bottom: 2px; }
.cinema video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; }
</style>
</head>
<body>
<div class="livro">
  <header class="capa">
    <span class="elastico" aria-hidden="true"></span>
    <img class="logo" src="/amigomagico/img/amadeus-horizontal.webp" alt="Centro Educacional Amadeus" width="560" height="139">
    <h1>Meu Mundo da Imaginação<span>Grupo V · 18/12</span></h1>
    <a class="sair" href="/amigomagico/sair">sair</a>
  </header>

  <main class="folha">
    <p class="intro">Tudo da atividade "Meu amigo mágico", na ordem em que você vai usar.</p>
    <nav class="grade" aria-label="Partes da atividade">
      <a class="quadro" href="/amigomagico/caderno">
        <span class="n">1</span>
        <span class="des"><img class="foto" src="/amigomagico/img/capa-caderno.webp" alt="" width="520" height="1125"></span>
        <b>Caderno da professora</b>
        <small>Comece por aqui</small>
        <span class="ir">abrir ›</span>
      </a>
      <button class="quadro" type="button" id="abrir-video">
        <span class="n">2</span>
        <span class="des"><img class="foto" src="/amigomagico/img/capa-video.webp" alt=""></span>
        <b>Vídeo para as crianças</b>
        <small>Passe na TV, em roda</small>
        <span class="ir">assistir ›</span>
      </button>
      <a class="quadro" href="/amigomagico/caderno-da-crianca.pdf" download>
        <span class="n">3</span>
        <span class="des"><img class="foto" src="/amigomagico/img/folha-1.webp" alt="" width="900" height="1273"></span>
        <b>Caderno da criança</b>
        <small>A4, tamanho real</small>
        <span class="ir">baixar o PDF ›</span>
      </a>
      <a class="quadro" href="/amigomagico/diario">
        <span class="n">4</span>
        <span class="des">
          <svg viewBox="0 0 120 100" width="120" height="100" aria-hidden="true">
            <path d="M14 18c0-6 4-10 10-10h52c6 0 10 4 10 10v30c0 6-4 10-10 10H42L26 72V58h-2c-6 0-10-4-10-10z" fill="#FFF2B5" stroke="#22338A" stroke-width="3" stroke-linejoin="round"/>
            <path d="M28 26h44M28 38h30" stroke="#4A5A9E" stroke-width="3" stroke-linecap="round"/>
            <rect x="62" y="44" width="44" height="34" rx="6" fill="#fff" stroke="#22338A" stroke-width="3"/>
            <circle cx="84" cy="61" r="9" fill="none" stroke="#E9832A" stroke-width="3"/>
            <path d="M70 44l4-6h20l4 6" fill="none" stroke="#22338A" stroke-width="3" stroke-linejoin="round"/>
            <rect x="20" y="78" width="10" height="16" rx="5" fill="#E5747D"/>
            <path d="M14 86a11 11 0 0 0 22 0" fill="none" stroke="#E5747D" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <b>Diário da formatura</b>
        <small>Texto, foto e áudio por aluno</small>
        <span class="ir">registrar ›</span>
      </a>
    </nav>
  </main>
</div>

<div class="cinema" id="cinema" role="dialog" aria-modal="true" aria-label="Vídeo para as crianças">
  <div class="barra">
    <button type="button" id="fechar-video">‹ voltar</button>
    <a href="/amigomagico/ilha-da-imaginacao.mp4" download>baixar para a TV ›</a>
  </div>
  <video id="video" controls playsinline preload="none" poster="/amigomagico/img/capa-video.webp">
    <source src="/amigomagico/ilha-da-imaginacao.mp4" type="video/mp4">
  </video>
</div>

<script>
(function () {
  var cinema = document.getElementById('cinema'), video = document.getElementById('video');
  function abrir() {
    cinema.classList.add('on');
    history.pushState({ video: 1 }, '');
    /* a tela escura já ocupa o celular inteiro e deixa o "baixar para a TV" à vista; o botão de tela cheia do próprio vídeo continua lá */
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }
  function fechar() { video.pause(); cinema.classList.remove('on'); if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
  document.getElementById('abrir-video').addEventListener('click', abrir);
  document.getElementById('fechar-video').addEventListener('click', function () { history.back(); });
  window.addEventListener('popstate', function () { if (cinema.classList.contains('on')) fechar(); });
})();
</script>
</body>
</html>
