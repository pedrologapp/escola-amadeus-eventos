<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Meu Mundo da Imaginação · Grupo V</title>
<meta property="og:title" content="Meu Mundo da Imaginação · Formatura do Grupo V">
<meta property="og:description" content="O caderno da professora, o vídeo para as crianças, o caderno da criança e o diário da formatura.">
<meta property="og:image" content="https://www.escolaamadeus.com/amigomagico/img/capa.jpg">
<meta name="theme-color" content="#1E2C78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* (18/11, Pedro: a prévia aprovada) o menu inteiro é a capa azul do caderno: tecido, lombada à esquerda e elástico à direita,
   ocupando a tela toda. Em cima a logo, a etiqueta e o gato adesivo; embaixo, quatro etiquetas creme quadradas coladas na capa
   com fita, levemente tortas, cada uma com um ícone desenhado. Tudo cabe numa tela, sem rolar: a grade diminui pela altura. */
:root {
  --papel: #FFFDF7; --tinta: #22338A; --tinta-2: #4A5A9E; --laranja: #E9832A; --rosa: #E5747D;
  --capa: #1E2C78; --capa-escura: #16205A;
  --titulo: Caveat, "Segoe Print", cursive; --mao: "Patrick Hand", "Segoe Print", cursive;
}
* { box-sizing: border-box; }
/* o azul vai até as bordas (atrás da barra de status e embaixo); nunca branco */
html { min-height: 100%; background: var(--capa-escura); }
body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; position: relative; font-family: var(--mao); color: var(--tinta); -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(120% 70% at 25% 0%, rgba(255, 255, 255, .09), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .05) 0 1px, transparent 1px 3px),
    linear-gradient(170deg, var(--capa), var(--capa-escura));
  display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top)) 40px calc(16px + env(safe-area-inset-bottom)) 30px; }
body::before { content: ""; position: fixed; left: 0; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, rgba(0,0,0,.3), rgba(0,0,0,.06) 70%, rgba(255,255,255,.06)); pointer-events: none; }
.elastico { position: fixed; top: 0; bottom: 0; right: 16px; width: 11px; background: linear-gradient(90deg, #C9661A, var(--laranja) 40%, #F5A35A 60%, #C9661A); box-shadow: 0 0 8px rgba(0,0,0,.35); pointer-events: none; }

/* o alto da capa */
.topo { position: relative; flex: none; height: 150px; max-width: 460px; width: 100%; margin: 0 auto; }
.logo { display: block; width: 148px; height: auto; }
.sair { position: absolute; z-index: 1; right: 0; top: 0; padding: 2px 4px; font: 700 16px/1 var(--titulo); color: rgba(255, 255, 255, .75); text-decoration: none; }
.etiqueta { position: absolute; z-index: 1; left: 0; bottom: 6px; margin: 0; white-space: nowrap; background: var(--papel); color: var(--tinta); border-radius: 8px; padding: 9px 12px 8px; box-shadow: 0 8px 18px rgba(0,0,0,.35); font-weight: 400; }
.etiqueta::after { content: ""; position: absolute; inset: 4px; border: 1.3px solid var(--tinta); border-radius: 5px; opacity: .5; pointer-events: none; }
.etiqueta b { display: block; font: 700 23px/23px var(--titulo); }
.etiqueta span { display: block; margin-top: 2px; font: 700 16px/17px var(--titulo); color: var(--rosa); }
.gato { position: absolute; right: 2px; top: 22px; width: 128px; height: auto; transform: rotate(-7deg);
  filter: drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
.estrela { position: absolute; width: 12px; height: 12px; }
@media (max-width: 370px) { .gato { width: 104px; top: 30px; } }

/* as quatro etiquetas quadradas: a grade encolhe para caber na altura que sobra */
.grade { flex: 1; min-height: 0; display: grid; place-content: center; padding-top: 14px; }
.grade-in { display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  width: min(calc(100vw - 70px), 420px, calc((100vh - 296px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) + 14px));
  width: min(calc(100vw - 70px), 420px, calc((100dvh - 296px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) + 14px)); }
.quadro { aspect-ratio: 1 / 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 8px;
  text-align: center; text-decoration: none; color: inherit; font: inherit; border: 0; cursor: pointer;
  background: var(--papel) repeating-linear-gradient(180deg, transparent 0 21px, #E3EBF4 21px 22px); border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,.3); }
.quadro:nth-child(1) { transform: rotate(-1.5deg); } .quadro:nth-child(2) { transform: rotate(1.2deg); }
.quadro:nth-child(3) { transform: rotate(1deg); } .quadro:nth-child(4) { transform: rotate(-1.2deg); }
.quadro:active { scale: .97; }
.quadro:focus-visible { outline: 3px solid var(--laranja); outline-offset: 3px; }
.quadro::before { content: ""; position: absolute; top: -8px; left: 50%; width: 48px; height: 16px; margin-left: -24px; transform: rotate(-3deg); background: repeating-linear-gradient(90deg, rgba(229,116,125,.6) 0 7px, rgba(229,116,125,.42) 7px 14px); }
.quadro:nth-child(even)::before { background: repeating-linear-gradient(90deg, rgba(120,200,212,.65) 0 7px, rgba(120,200,212,.45) 7px 14px); }
.quadro svg { width: 46%; height: auto; max-height: 52%; flex: none; }
.quadro b { font: 700 clamp(17px, 5vw, 21px)/1.02 var(--titulo); }
.quadro small { font-size: 13px; line-height: 1.1; color: var(--tinta-2); }
/* (24/11, Pedro) a 5ª etiqueta: "Revisar amigos", uma faixa larga embaixo da grade */
.quadro.largo { grid-column: 1 / -1; aspect-ratio: auto; height: 72px; flex-direction: row; gap: 12px; padding: 8px 14px; rotate: .6deg; transform: none; }
.quadro.largo svg { width: 46px; max-height: none; }
.quadro.largo span { display: grid; text-align: left; }

/* o vídeo em tela cheia */
.cinema { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0b0f1d; color: #fff;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.cinema.on { display: flex; }
.cinema .barra { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
.cinema button, .cinema a { font: 700 23px/1 var(--titulo); color: #fff; background: none; border: 0; text-decoration: none; cursor: pointer; padding: 8px 4px; }
.cinema a { color: #F5A35A; border-bottom: 2px solid #F5A35A; padding-bottom: 2px; }
.cinema video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; }
</style>
</head>
<body>
  <span class="elastico" aria-hidden="true"></span>
  <header class="topo">
    <img class="logo" src="/amigomagico/img/amadeus-horizontal.webp" alt="Centro Educacional Amadeus" width="560" height="139">
    <a class="sair" href="/amigomagico/sair">sair</a>
    <svg class="estrela" style="left:170px;top:52px" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 0 C10 6 12 8 18 9 C12 10 10 12 9 18 C8 12 6 10 0 9 C6 8 8 6 9 0Z" fill="#F8CC3A"/></svg>
    <h1 class="etiqueta"><b>Formatura Grupo V</b><span>Meu Mundo da Imaginação</span></h1>
    <img class="gato" src="/amigomagico/img/gato-caderno.webp" alt="" width="720" height="565">
  </header>
  <main class="grade">
    <nav class="grade-in" aria-label="Partes da atividade">
      <a class="quadro" href="/amigomagico/caderno"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="6" width="40" height="52" rx="4" fill="#1E2C78" stroke="#22338A" stroke-width="2.5"/><rect x="44" y="6" width="4" height="52" fill="#E9832A"/><rect x="18" y="30" width="22" height="14" rx="2" fill="#FFFDF7"/><path d="M22 35 H36 M22 39 H32" stroke="#22338A" stroke-width="1.8" stroke-linecap="round"/></svg><b>Caderno da professora</b><small>comece por aqui</small></a>
      <button class="quadro" type="button" id="abrir-video"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 6 L30 16 M44 6 L34 16" stroke="#22338A" stroke-width="2.5" stroke-linecap="round"/><rect x="6" y="16" width="52" height="36" rx="6" fill="#fff" stroke="#22338A" stroke-width="2.5"/><rect x="12" y="22" width="40" height="24" rx="3" fill="#E8F3FB"/><path d="M28 28 L38 34 L28 40 Z" fill="#E9832A"/></svg><b>Vídeo para as crianças</b><small>passe na TV</small></button>
      <a class="quadro" href="/amigomagico/caderno-da-crianca.pdf" download><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="6" width="36" height="50" rx="3" fill="#fff" stroke="#22338A" stroke-width="2.5"/><rect x="19" y="14" width="12" height="12" rx="2" fill="none" stroke="#E9832A" stroke-width="2"/><rect x="33" y="14" width="12" height="12" rx="2" fill="none" stroke="#E9832A" stroke-width="2"/><rect x="19" y="30" width="12" height="12" rx="2" fill="none" stroke="#E9832A" stroke-width="2"/><rect x="33" y="30" width="12" height="12" rx="2" fill="none" stroke="#E9832A" stroke-width="2"/><path d="M44 44 L56 56" stroke="#22338A" stroke-width="3" stroke-linecap="round"/><path d="M53 53 L58 58" stroke="#F8CC3A" stroke-width="5" stroke-linecap="round"/></svg><b>Caderno da criança</b><small>PDF para imprimir</small></a>
      <a class="quadro" href="/amigomagico/diario"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="8" width="44" height="32" rx="10" fill="#FFF2B5" stroke="#22338A" stroke-width="2.5"/><path d="M16 40 L13 50 L26 40" fill="#FFF2B5" stroke="#22338A" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 20 H40 M16 28 H32" stroke="#22338A" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="44" r="10" fill="#E9832A"/><path d="M46 44 L49 47 L55 40" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><b>Diário da formatura</b><small>registre cada criança</small></a>
      <a class="quadro largo" href="/amigomagico/revisar"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="6" width="38" height="50" rx="4" fill="#fff" stroke="#22338A" stroke-width="2.5"/><path d="M18 20 L23 25 L32 15 M18 36 L23 41 L32 31" stroke="#7FCF6B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 21 H42 M36 37 H42" stroke="#4A5A9E" stroke-width="2.5" stroke-linecap="round"/><path d="M40 52 L56 36 L61 41 L45 57 L38 59 Z" fill="#E9832A" stroke="#22338A" stroke-width="2.5" stroke-linejoin="round"/></svg><span><b>Revisar amigos</b><small>confira e corrija o nome de cada amigo</small></span></a>
    </nav>
  </main>

<div class="cinema" id="cinema" role="dialog" aria-modal="true" aria-label="Vídeo para as crianças">
  <div class="barra">
    <button type="button" id="fechar-video">‹ voltar</button>
    <a href="/amigomagico/ilha-da-imaginacao.mp4" download>baixar para a TV ›</a>
  </div>
  <video id="video" controls playsinline preload="none" poster="/amigomagico/img/capa-video.webp">
    <source src="/amigomagico/ilha-da-imaginacao.mp4" type="video/mp4">
  </video>
</div>

<script>
(function () {
  var cinema = document.getElementById('cinema'), video = document.getElementById('video');
  function abrir() {
    cinema.classList.add('on');
    history.pushState({ video: 1 }, '');
    /* a tela escura já ocupa o celular inteiro e deixa o "baixar para a TV" à vista; o botão de tela cheia do próprio vídeo continua lá */
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }
  function fechar() { video.pause(); cinema.classList.remove('on'); if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
  document.getElementById('abrir-video').addEventListener('click', abrir);
  document.getElementById('fechar-video').addEventListener('click', function () { history.back(); });
  window.addEventListener('popstate', function () { if (cinema.classList.contains('on')) fechar(); });
})();
</script>
</body>
</html>
