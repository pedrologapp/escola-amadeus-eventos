<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feira de Ciências · Arboria</title>
<meta name="description" content="A Feira de Ciências da Culminância do Projeto Arboria foi encerrada. Obrigado pela visita!">
<meta name="theme-color" content="#0b1426">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@600;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* (13/11/2026) A Culminância acabou: o teste foi desligado e /feira mostra só este aviso.
     O teste completo continua guardado em Arbória/Culminância/oficina.html. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #080f1e; color: #f4ead5; font-family: "Inter", system-ui, sans-serif; min-height: 100dvh; }
  .ceu { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, #1c2b55 0%, #0b1426 55%, #060c18 100%); }
  main { position: relative; min-height: 100dvh; max-width: 560px; margin: 0 auto; padding: 40px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .folha { width: 110px; filter: drop-shadow(0 0 22px rgba(94,230,208,.45)); animation: flutua 5s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-8px) rotate(2deg); } }
  .escola { font-weight: 800; font-size: 13px; letter-spacing: .22em; color: #8fa1bb; margin-top: 6px; }
  h1 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: clamp(32px, 8.6vw, 46px); line-height: 1.05; }
  h1 span { color: #5ee6d0; }
  .obrigado { font-family: "Caveat", cursive; color: #ffc56b; font-size: clamp(26px, 7vw, 34px); line-height: 1.1; }
  .sonho { font-family: "Lilita One", sans-serif; font-size: clamp(21px, 5.6vw, 27px); line-height: 1.2; margin-top: 22px; padding-top: 20px; border-top: 1.5px solid rgba(244,234,213,.14); }
  .sonho span { color: #ffc56b; }
  .arboria { font-family: "Lilita One", sans-serif; color: #5ee6d0; font-size: 34px; margin-top: 8px; }
  .mat { font-family: "Lilita One", sans-serif; font-size: 22px; margin-top: 18px; }
  .mat span { color: #ffc56b; }
</style>
</head>
<body>
<div class="ceu"></div>
<main>
  <img class="folha" src="/feira/img/simbolo-v3.png" alt="Símbolo do Arboria">
  <div class="escola">ESCOLA AMADEUS</div>
  <h1>A <span>Feira de Ciências</span> foi encerrada</h1>
  <div class="obrigado">Obrigado por cultivar as 8 inteligências com a gente!</div>
  <p class="sonho">“E o nosso sonho é simples: que nenhuma criança saia desta escola <span>sem saber do que é capaz</span>.”</p>
  <div class="arboria">Arboria</div>
  <div class="mat">Matrículas abertas <span>2027</span></div>
</main>
</body>
</html>
