<!doctype html>
<!-- Casa Interpessoal (Projeto Arbória, prof. Francinildo): as 9 telas do storyboard em loop infinito para a TV.
     Telas melhoradas para 4K a partir do GIF (12/11/2026). Endereço: www.escolaamadeus.com/casainterpessoal (rewrite no next.config.ts). -->
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Interpessoal · Projeto Arboria</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0b1a10; --dica: rgba(253,246,227,.8); color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; cursor: none; }
  .palco { position: fixed; inset: 0; }
  .tela { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .tela.on { opacity: 1; }
  /* fundo desfocado da própria tela preenche as bordas quando a TV não é 16:9 */
  .tela .fundo { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.55); }
  .tela img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tela.on img { animation: zoom var(--dur) linear forwards; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.045); } }
  @media (prefers-reduced-motion: reduce) { .tela.on img { animation: none; } }
  .dica { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font: 600 15px/1.3 system-ui, sans-serif;
    color: var(--dica); background: rgba(0,0,0,.45); padding: 8px 16px; border-radius: 999px; transition: opacity .6s; pointer-events: none; }
  .dica.some { opacity: 0; }
</style>
</head><body>
<div class="palco" id="palco" role="img" aria-label="Projeto Arboria, Casa Interpessoal"></div>
<div class="dica" id="dica">Toque ou clique para tela cheia</div>
<script>
const SEG = 6, N = 9;
const palco = document.getElementById('palco');
document.documentElement.style.setProperty('--dur', SEG + 1.2 + 's');
const telas = Array.from({ length: N }, (_, i) => {
  const src = `/casainterpessoal/telas/tela-${i + 1}.jpg`;
  const d = document.createElement('div');
  d.className = 'tela';
  d.innerHTML = `<div class="fundo" style="background-image:url('${src}')"></div><img src="${src}" alt="">`;
  palco.appendChild(d);
  return d;
});
let atual = 0;
telas[0].classList.add('on');
setInterval(() => {
  const prox = (atual + 1) % N;
  const img = telas[prox].querySelector('img');
  img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
  telas[prox].classList.add('on');
  telas[atual].classList.remove('on');
  atual = prox;
}, SEG * 1000);
const dica = document.getElementById('dica');
setTimeout(() => dica.classList.add('some'), 6000);
document.addEventListener('click', () => {
  dica.classList.add('some');
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
});
async function acordado() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
acordado();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') acordado(); });
</script>
</body></html>
