<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo do Arboria · em pausa</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1114; color: #e9efe9; font: 500 18px/1.45 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 30px; margin: 0 0 10px; }
  p { color: #9fb0ac; margin: 0; max-width: 420px; }
  .simbolo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: radial-gradient(circle, #5ee0d0 0 30%, transparent 32%), #13221f; }
</style>
</head>
<body>
<main>
  <div>
    <div class="simbolo"></div>
    <h1>O Mundo do Arboria está em pausa</h1>
    <p>Logo ele volta. Obrigado por fazer parte dessa aventura!</p>
  </div>
</main>
<script>
  // desliga o service worker antigo do jogo (os tablets tinham o jogo guardado)
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
</script>
</body>
</html>
