<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A Jornada · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<!--
  Protótipo da "série" do Arboria (Experiência Amadeus, 10/10/2026), ~20 s, Infantil.
  ?v=2 usa os vídeos gerados (nave decolando, descida no planeta); sem ?v usa só código.
  ?mascara=1 mostra a criança de máscara (quando o pai não manda foto). ?nome=Maria
-->
<style>
  :root { --ouro: #FFC94A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #palco { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100svh * 9 / 16)); height: min(100svh, calc(100vw * 16 / 9)); overflow: hidden; background: #050a24; }
  .plano { position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease; overflow: hidden; }
  .plano.on { opacity: 1; }
  .camera { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  canvas.estrelas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .barras::before, .barras::after { content: ""; position: absolute; left: 0; right: 0; height: 6%; background: #000; z-index: 30; }
  .barras::before { top: 0; } .barras::after { bottom: 0; }

  /* legenda de série */
  #legenda { position: absolute; left: 7%; right: 7%; bottom: 10%; z-index: 40; text-align: center; font: 700 clamp(15px, 4.3vw, 21px)/1.35 Inter, sans-serif;
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.6); opacity: 0; transition: opacity .4s ease; }
  #legenda.on { opacity: 1; }
  #legenda b { color: var(--ouro); }

  /* abertura */
  #abertura { background: #000; display: grid; place-items: center; text-align: center; }
  .linha-luz { position: absolute; top: 50%; left: 50%; width: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--ouro), transparent); transform: translate(-50%, -50%); box-shadow: 0 0 24px var(--ouro); }
  #abertura.on .linha-luz { animation: luz 1.4s cubic-bezier(.7,0,.2,1) .25s forwards; }
  @keyframes luz { 0% { width: 0; opacity: 1; } 60% { width: 90%; opacity: 1; } 100% { width: 90%; opacity: 0; } }
  .serie-original { font: 700 11px Inter; letter-spacing: .42em; color: rgba(255,255,255,.7); opacity: 0; }
  .titulo { font-family: Fraunces, serif; font-weight: 800; font-size: clamp(36px, 12vw, 58px); line-height: .95; letter-spacing: -.01em; margin-top: 14px; opacity: 0; }
  .titulo em { font-style: italic; font-weight: 600; color: var(--ouro); display: block; font-size: .55em; letter-spacing: .02em; margin-bottom: 6px; }
  #abertura.on .serie-original { animation: aparece 1s ease 1.1s forwards; }
  #abertura.on .titulo { animation: titulo 1.6s cubic-bezier(.2,.8,.2,1) 1.4s forwards; }
  @keyframes aparece { to { opacity: 1; } }
  @keyframes titulo { from { opacity: 0; transform: scale(1.18); filter: blur(10px); letter-spacing: .1em; } to { opacity: 1; transform: none; filter: none; } }

  /* plano 1: céu, a nave e a criança chegando */
  #p1 .camera { animation: grua 4.2s cubic-bezier(.4,0,.2,1) both paused; }
  #p1.on .camera { animation-play-state: running; }
  @keyframes grua { from { transform: scale(1.35) translateY(22%); } to { transform: scale(1) translateY(0); } }
  .chao { position: absolute; left: -10%; right: -10%; bottom: -2%; height: 30%; background: radial-gradient(ellipse at 50% 0%, #2d5a3c 0%, #173326 55%, #0b1a14 100%); border-radius: 50% 50% 0 0 / 40% 40% 0 0; }
  .nave { position: absolute; left: 50%; width: 62%; translate: -50% 0; filter: drop-shadow(0 0 40px rgba(255,214,120,.45)); }
  #p1 .nave { top: 26%; animation: flutua 2.6s ease-in-out infinite alternate; }
  @keyframes flutua { to { transform: translateY(-14px) rotate(1.5deg); } }
  .facho { position: absolute; left: 50%; top: 44%; width: 46%; height: 42%; translate: -50% 0; background: linear-gradient(rgba(255,226,140,.55), rgba(255,226,140,0)); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); filter: blur(4px); animation: facho 1.6s ease-in-out infinite alternate; }
  @keyframes facho { from { opacity: .45; } to { opacity: .85; } }
  .crianca { position: absolute; bottom: 7%; height: 34%; }
  #p1 .crianca { left: 50%; animation: anda 4.2s ease-out both paused; }
  #p1.on .crianca { animation-play-state: running; }
  @keyframes anda { 0% { transform: translateX(-160%) scale(.8); } 100% { transform: translateX(-50%) scale(1); } }
  .crianca img { height: 100%; animation: passinho .45s ease-in-out infinite alternate; transform-origin: 50% 100%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)); }
  @keyframes passinho { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(-6px); } }

  /* plano 2: close no rosto */
  #p2 .fundo-desfocado { position: absolute; inset: -10%; background: radial-gradient(circle at 30% 30%, rgba(255,214,120,.8), transparent 18%), radial-gradient(circle at 75% 20%, rgba(150,200,255,.7), transparent 12%), radial-gradient(circle at 60% 55%, rgba(255,190,90,.5), transparent 16%), radial-gradient(circle at 20% 70%, rgba(120,170,255,.45), transparent 14%), #0b1440; filter: blur(14px); }
  #p2 .camera { animation: empurra 3.4s ease-out both paused; }
  #p2.on .camera { animation-play-state: running; }
  @keyframes empurra { from { transform: scale(1.02); } to { transform: scale(1.16) translateY(3%); } }
  #p2 .rosto { position: absolute; left: 50%; bottom: -6%; height: 104%; translate: -50% 0; }
  .luz-rosto { position: absolute; inset: 0; background: radial-gradient(circle at 50% 18%, rgba(255,226,150,.35), transparent 45%); mix-blend-mode: screen; animation: piscaluz 1.2s ease-in-out infinite alternate; }
  @keyframes piscaluz { to { opacity: .4; } }

  /* plano 3: a nave decola com a criança dentro */
  #p3 .camera { animation: tremor .12s linear infinite paused; }
  #p3.on .camera { animation-play-state: running; }
  @keyframes tremor { 0% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); } 50% { transform: translate(-1px,2px); } 75% { transform: translate(1px,1px); } }
  .nave-grande { position: absolute; left: 50%; top: 50%; width: 86%; aspect-ratio: 1; translate: -50% -50%; }
  #p3.on .nave-grande { animation: decola 4.2s cubic-bezier(.6,0,.4,1) both; }
  @keyframes decola { 0% { transform: translateY(18%) scale(.75); } 30% { transform: translateY(0) scale(.8) rotate(-3deg); } 100% { transform: translateY(-10%) scale(3.4) rotate(4deg); filter: blur(3px); opacity: .0; } }
  .nave-grande img.n { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* a cabine (cúpula de vidro): o rosto dela lá dentro */
  .cabine { position: absolute; left: 40%; top: 23%; width: 26%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
  .cabine img { position: absolute; width: 240%; left: -70%; top: -108%; }
  .cabine::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 35%), radial-gradient(circle, transparent 55%, rgba(120,190,230,.45)); }
  video.cheio { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* plano 4: chegada no planeta */
  #p4 .camera { animation: desce 6s cubic-bezier(.3,0,.2,1) both paused; }
  #p4.on .camera { animation-play-state: running; }
  @keyframes desce { from { transform: scale(1.45) translateY(18%) rotate(-4deg); } to { transform: scale(1.02) translateY(0) rotate(0); } }
  #p4 .crianca { left: 50%; translate: -50% 0; opacity: 0; }
  #p4.on .crianca { animation: pousa 1.1s cubic-bezier(.2,1.4,.4,1) 2.4s forwards; }
  @keyframes pousa { 0% { opacity: 1; transform: translateY(-120%) scale(.6); } 70% { opacity: 1; transform: translateY(4%) scaleY(.9); } 100% { opacity: 1; transform: none; } }
  .notas { position: absolute; inset: 0; pointer-events: none; }
  .notas span { position: absolute; font-size: 26px; opacity: 0; animation: nota 3s ease-in-out infinite; }
  @keyframes nota { 0% { opacity: 0; transform: translateY(20px) rotate(-10deg); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-120px) rotate(15deg); } }

  /* fim */
  #fim { background: radial-gradient(circle at 50% 40%, #1d2b6b, #050a24 70%); display: grid; place-items: center; text-align: center; padding: 0 10%; }
  #fim .ep { font: 700 11px Inter; letter-spacing: .38em; color: rgba(255,255,255,.65); }
  #fim .t { font-family: Fraunces, serif; font-weight: 800; font-size: clamp(30px, 9vw, 44px); margin-top: 10px; line-height: 1; }
  #fim .c { margin-top: 16px; font-family: Fraunces, serif; font-style: italic; color: var(--ouro); font-size: 19px; }
  #fim button { margin-top: 30px; background: none; border: 1.5px solid rgba(255,255,255,.6); color: #fff; padding: 10px 20px; border-radius: 99px; font: 600 14px Inter; }

  /* começar (o som do celular só toca depois de um toque) */
  #comecar { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1d2b6b, #000 75%); text-align: center; padding: 0 12%; }
  #comecar p { font: 700 11px Inter; letter-spacing: .38em; color: rgba(255,255,255,.65); }
  #comecar h1 { font-family: Fraunces, serif; font-size: 34px; line-height: 1.05; margin: 12px 0 28px; }
  #comecar button { background: var(--ouro); color: #1a1300; border: 0; border-radius: 99px; padding: 15px 28px; font: 700 16px Inter; box-shadow: 0 10px 30px rgba(255,201,74,.35); }
  #comecar small { display: block; margin-top: 14px; color: rgba(255,255,255,.55); font-size: 12px; }
</style>
</head>
<body>
<div id="palco" class="barras">
  <section class="plano" id="abertura">
    <div class="linha-luz"></div>
    <div><p class="serie-original">UMA SÉRIE ORIGINAL ARBORIA</p><h1 class="titulo"><em>a jornada de</em><span class="nome">Maria</span></h1></div>
  </section>

  <section class="plano" id="p1">
    <div class="camera">
      <canvas class="estrelas" data-vel="0.15"></canvas>
      <div class="facho"></div>
      <img class="nave" src="nave-vagalume.webp" alt="">
      <div class="chao"></div>
      <div class="crianca"><img class="corpo" src="pintado.webp" alt=""></div>
    </div>
  </section>

  <section class="plano" id="p2">
    <div class="camera">
      <div class="fundo-desfocado"></div>
      <img class="rosto" src="close.webp" alt="">
      <div class="luz-rosto"></div>
    </div>
  </section>

  <section class="plano" id="p3">
    <div class="camera">
      <canvas class="estrelas" data-vel="1"></canvas>
      <div class="nave-grande"><img class="n" src="nave-vagalume.webp" alt=""><div class="cabine"><img class="rostinho" src="close.webp" alt=""></div></div>
      <video class="cheio v2" src="nave.mp4" muted playsinline preload="auto"></video>
    </div>
  </section>

  <section class="plano" id="p4">
    <div class="camera">
      <video class="cheio" src="planeta.mp4" muted playsinline loop preload="auto"></video>
      <video class="cheio v2" src="descida.mp4" muted playsinline preload="auto"></video>
      <div class="notas"><span style="left:18%;top:40%">♪</span><span style="left:72%;top:35%;animation-delay:1s">♫</span><span style="left:45%;top:28%;animation-delay:2s">♪</span></div>
      <div class="crianca"><img class="corpo" src="pintado.webp" alt=""></div>
    </div>
  </section>

  <section class="plano" id="fim">
    <div><p class="ep">EPISÓDIO 1</p><p class="t">A jornada de <span class="nome">Maria</span></p><p class="c">continua em 2027…</p><button onclick="location.reload()">assistir de novo</button></div>
  </section>

  <div id="legenda"></div>

  <div id="comecar">
    <div><p>UMA SÉRIE ORIGINAL ARBORIA</p><h1>A jornada de <span class="nome">Maria</span></h1><button id="play">▶ Assistir ao episódio</button><small>aumente o volume 🔊</small></div>
  </div>
</div>
<audio id="trilha" src="trilha.mp3" preload="auto"></audio>

<script>
const q = new URLSearchParams(location.search);
const V2 = q.get('v') === '2';
const nome = (q.get('nome') || 'Maria').replace(/[<>]/g, '');
document.querySelectorAll('.nome').forEach(e => e.textContent = nome);
if (q.get('mascara') === '1') {
  document.querySelectorAll('img.corpo').forEach(i => i.src = 'mascara.webp');
  document.querySelectorAll('img.rosto, img.rostinho').forEach(i => i.src = 'close-mascara.webp');
}
if (!V2) document.querySelectorAll('.v2').forEach(v => v.remove());
else document.querySelectorAll('#p3 .nave-grande, #p3 canvas').forEach(e => e.remove());

// estrelas em profundidade (as mais perto passam mais rápido)
document.querySelectorAll('canvas.estrelas').forEach(cv => {
  const ctx = cv.getContext('2d'), vel = +cv.dataset.vel;
  const pts = Array.from({ length: 220 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
  const tick = () => {
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    ctx.fillStyle = vel > .5 ? 'rgba(5,10,36,.55)' : '#0b1440'; ctx.fillRect(0, 0, w, h);
    for (const p of pts) {
      p.z -= 0.0025 + vel * 0.02; if (p.z <= 0.02) { p.z = 1; p.x = Math.random() * 2 - 1; p.y = Math.random() * 2 - 1; }
      const sx = w / 2 + p.x / p.z * w * .5, sy = h / 2 + p.y / p.z * h * .5, r = (1 - p.z) * 2.4 * devicePixelRatio;
      ctx.globalAlpha = 1 - p.z; ctx.fillStyle = '#fff';
      if (vel > .5) { ctx.strokeStyle = 'rgba(255,240,200,' + (1 - p.z) + ')'; ctx.lineWidth = r; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(w / 2 + p.x / (p.z + .06) * w * .5, h / 2 + p.y / (p.z + .06) * h * .5); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.28); ctx.fill(); }
    }
    ctx.globalAlpha = 1; requestAnimationFrame(tick);
  };
  tick();
});

// sons feitos no próprio navegador: o "tum-tum" da abertura e o "vuuush" da decolagem
let ac;
function tum(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + .45); g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .6); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .65); }
function vuuush(t, dur) { const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; n.buffer = b; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(2400, t + dur * .7); const g = ac.createGain(); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.5, t + dur * .6); g.gain.exponentialRampToValueAtTime(.001, t + dur); n.connect(f).connect(g).connect(ac.destination); n.start(t); }
function boing(t) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(520, t + .12); o.frequency.exponentialRampToValueAtTime(260, t + .35); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .45); }

const legenda = document.getElementById('legenda');
function fala(html) { legenda.classList.remove('on'); setTimeout(() => { legenda.innerHTML = html; if (html) legenda.classList.add('on'); }, html ? 250 : 0); }
function plano(id) { document.querySelectorAll('.plano').forEach(p => p.classList.toggle('on', p.id === id)); const s = document.getElementById(id); s.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play().catch(() => {}); }); }

const ROTEIRO = [
  [0, () => { plano('abertura'); const t = ac.currentTime; tum(t + .3); tum(t + .75); }],
  [3.4, () => { plano('p1'); document.getElementById('trilha').play().catch(() => {}); fala('Toda grande jornada começa com um passo.'); }],
  [7.4, () => { plano('p2'); fala(`<b>${nome}</b> olhou pro céu… e a nave piscou pra ela.`); }],
  [10.6, () => { plano('p3'); fala('Destino: o Planeta-Tambor.'); vuuush(ac.currentTime + .6, 3.2); }],
  [14.8, () => { plano('p4'); fala(''); setTimeout(() => boing(ac.currentTime), 2700); }],
  [17.6, () => fala(`Todo mundo sabe que a <b>${nome}</b> adora cantar e batucar.<br>Aqui, até a chuva toca música.`)],
  [22.6, () => { fala(''); plano('fim'); }],
];

document.getElementById('play').onclick = () => {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('comecar').remove();
  const a = document.getElementById('trilha'); a.volume = .55;
  ROTEIRO.forEach(([t, f]) => setTimeout(f, t * 1000));
};
</script>
</body>
</html>
