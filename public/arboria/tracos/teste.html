<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Traço vivo · cabine</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Atkinson+Hyperlegible:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; } html, body { height: 100%; background: #000; overflow: hidden; }
  #palco { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100svh * 2 / 3)); height: min(100svh, calc(100vw * 3 / 2)); overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #23408f 0%, #0d1849 55%, #050a24 100%); }
  .cam { position: absolute; inset: 0; animation: cam 9s ease-in-out forwards; transform-origin: 50% 60%; }
  @keyframes cam { from { transform: scale(1.12) translateY(3%); } to { transform: scale(1); } }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .nome { position: absolute; left: 37.5%; width: 25%; top: 73.5%; text-align: center; font: 700 clamp(22px, 7vw, 34px) Caveat, cursive; color: #FFC94A;
    text-shadow: 0 0 10px rgba(255,201,74,.8); opacity: 0; transform: rotate(-4deg); }
  .nome.on { animation: escreve 1.2s steps(10) forwards; clip-path: inset(0 100% 0 0); }
  @keyframes escreve { to { opacity: 1; clip-path: inset(0 0 0 0); } }
  .botao { position: absolute; width: 1.6%; aspect-ratio: 1; border-radius: 50%; background: #FFC94A; box-shadow: 0 0 10px 3px rgba(255,201,74,.8); opacity: 0; }
  .botao.on { animation: pisca .8s ease-in-out infinite alternate; }
  @keyframes pisca { from { opacity: .1; } to { opacity: 1; } }
  .estrela { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; }
  .estrela.on { animation: pisca 1.4s ease-in-out infinite alternate; }
  #legenda { position: absolute; left: 6%; bottom: 5%; max-width: 70%; padding: 9px 13px; background: #FFF4D6; color: #1B2550; border: 2.5px solid #1B2550; box-shadow: 5px 5px 0 rgba(10,15,40,.55);
    font: 700 16px/1.3 "Atkinson Hyperlegible", sans-serif; rotate: -1.5deg; opacity: 0; transition: opacity .4s; }
  #legenda.on { opacity: 1; }
  #de-novo { position: absolute; right: 4%; top: 3%; background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 99px; padding: 6px 12px; font: 700 12px "Atkinson Hyperlegible"; }
</style>
</head>
<body>
<div id="palco">
  <div class="cam">
    <svg id="cabine"></svg>
    <div class="nome"></div>
  </div>
  <div id="legenda"></div>
  <button id="de-novo" onclick="location.reload()">ver de novo</button>
</div>
<script src="traco-vivo.js"></script>
<script>
const nome = (new URLSearchParams(location.search).get('nome') || 'Maria').replace(/[<>]/g, '').split(' ')[0];
document.querySelector('.nome').textContent = nome;
fetch('cabine.json').then((r) => r.json()).then((dados) => {
  // tira o vagalume da tela da poltrona, para o nome ocupar o lugar dele
  tracoVivo(document.getElementById('cabine'), dados, 'cabine.webp', { dur: 5.5, pular: [[270, 745, 420, 865]] });
  const palco = document.getElementById('palco');
  // botões do painel e estrelas da janelona piscando depois de desenhados
  [[23, 55.5], [28, 55.5], [33, 59], [62, 58], [67, 58], [72, 61], [44, 52], [56, 52]].forEach(([x, y], k) => {
    const b = document.createElement('i'); b.className = 'botao'; b.style.left = x + '%'; b.style.top = y + '%'; b.style.animationDelay = (k * .15) + 's';
    document.querySelector('.cam').appendChild(b); setTimeout(() => b.classList.add('on'), 5200 + k * 120);
  });
  for (let k = 0; k < 14; k++) { const s = document.createElement('i'); s.className = 'estrela'; s.style.left = 30 + Math.random() * 40 + '%'; s.style.top = 14 + Math.random() * 22 + '%'; s.style.animationDelay = Math.random() + 's'; document.querySelector('.cam').appendChild(s); setTimeout(() => s.classList.add('on'), 3000); }
  setTimeout(() => document.querySelector('.nome').classList.add('on'), 5800);
  setTimeout(() => { const l = document.getElementById('legenda'); l.innerHTML = `Esta é a nave da <b style="color:#C2410C">${nome}</b>.`; l.classList.add('on'); }, 6600);
});
</script>
</body>
</html>
